<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanta Agricoltura 2027 — Draft Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E1F38;
    --navy-deep:#081326;
    --cream:#F3EEE2;
    --cream-dim:#E7E0CE;
    --gold:#C9A24B;
    --gold-bright:#E4C574;
    --green:#2F6F4F;
    --green-bright:#3E9169;
    --rust:#B23A2E;
    --ink:#1B2430;
    --ink-soft:#4A5568;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #142c4d 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #0f2340 0%, transparent 40%),
      var(--navy);
    color:var(--cream);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--navy-deep) 0%, rgba(8,19,38,0.96) 80%, rgba(8,19,38,0));
    backdrop-filter:blur(6px);
    padding:0 20px 10px;
    border-bottom:1px solid rgba(201,162,75,0.25);
  }
  .pitch-banner{
    position:relative;
    height:30px;
    margin:0 -20px 14px;
    overflow:hidden;
    border-bottom:2px solid rgba(255,255,255,0.18);
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
  }
  .pitch-stripes{
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      90deg,
      #2F6F4F 0 30px,
      #275f43 30px 60px
    );
  }
  .pitch-banner::after{
    content:'';
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 9px);
    pointer-events:none;
  }
  .pitch-halfline{
    position:absolute; top:0; bottom:0; left:50%;
    width:2px;
    background:rgba(255,255,255,0.35);
    transform:translateX(-50%);
  }
  .pitch-center-circle{
    position:absolute; top:50%; left:50%;
    width:34px; height:34px;
    border:2px solid rgba(255,255,255,0.35);
    border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .pitch-ball{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:15px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5));
  }
  .title-row{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;
    max-width:920px; margin:0 auto;
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.02em;
    margin:0;
    color:var(--cream);
  }
  h1 span{color:var(--gold-bright);}
  .subtitle{
    font-size:12px;
    color:var(--gold);
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.04em;
  }
  .progress-wrap{
    max-width:920px; margin:14px auto 0;
  }
  .progress-bar{
    height:10px; border-radius:5px; background:rgba(255,255,255,0.08);
    overflow:hidden; border:1px solid rgba(201,162,75,0.3);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--green) 0%, var(--green-bright) 100%);
    transition:width 0.4s ease;
    width:0%;
  }
  .progress-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--cream-dim);
    margin-top:6px; display:flex; justify-content:space-between;
  }
  .tabs{
    display:flex; gap:6px; max-width:920px; margin:14px auto 0; overflow-x:auto;
    padding-bottom:2px;
  }
  .tab{
    font-family:'Oswald', sans-serif;
    font-size:13px; letter-spacing:0.03em;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid rgba(201,162,75,0.35);
    background:rgba(255,255,255,0.03);
    color:var(--cream-dim);
    cursor:pointer;
    white-space:nowrap;
    transition:all 0.15s ease;
    display:flex; align-items:center; gap:6px;
  }
  .tab.active{
    background:var(--gold);
    color:var(--navy-deep);
    border-color:var(--gold);
    font-weight:600;
  }
  .tab .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    opacity:0.85;
  }
  .rosa-tab{
    border-color:rgba(228,197,116,0.6);
    background:rgba(228,197,116,0.08);
    color:var(--gold-bright);
  }
  .rosa-tab.active{
    background:var(--gold-bright);
    color:var(--navy-deep);
    border-color:var(--gold-bright);
  }
  .rosa-summary{
    margin-bottom:20px;
  }
  .rosa-summary-row{
    display:flex; gap:12px;
  }
  .rosa-stat{
    flex:1;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(201,162,75,0.25);
    border-radius:6px;
    padding:14px 16px;
  }
  .rosa-stat-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--cream-dim);
    margin-bottom:6px;
  }
  .rosa-stat-value{
    font-family:'Oswald', sans-serif;
    font-size:32px;
    font-weight:600;
    color:var(--cream);
  }
  .rosa-stat-value.gold{ color:var(--gold-bright); }
  .rosa-stat-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:400;
    color:var(--cream-dim);
    margin-left:4px;
  }
  .rosa-empty{
    font-size:13px;
    color:var(--cream-dim);
    line-height:1.6;
    padding:20px 4px;
  }
  .rosa-role-block{
    margin-bottom:18px;
  }
  .rosa-role-header{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'Oswald', sans-serif;
    font-size:13px; letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--gold);
    padding-bottom:6px;
    margin-bottom:6px;
    border-bottom:1px solid rgba(201,162,75,0.25);
  }
  .rosa-role-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--cream-dim);
    text-transform:none;
    letter-spacing:0;
  }
  .rosa-list{
    display:flex; flex-direction:column; gap:4px;
  }
  .rosa-row{
    display:flex; align-items:center; gap:10px;
    background:var(--cream);
    color:var(--ink);
    border-radius:4px;
    padding:9px 12px;
    font-size:13px;
  }
  .rosa-row-name{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    flex:1;
  }
  .rosa-row-team{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .rosa-row-fvm{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    color:var(--green);
    min-width:34px;
    text-align:right;
  }
  main{
    max-width:920px; margin:0 auto; padding:22px 20px 0;
  }
  .role-heading{
    font-family:'Oswald', sans-serif;
    font-size:15px; letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--gold);
    margin:22px 0 12px;
    display:flex; align-items:center; gap:10px;
  }
  .role-heading::after{
    content:'';
    flex:1; height:1px;
    background:linear-gradient(90deg, rgba(201,162,75,0.5), transparent);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:14px;
  }
  .card{
    position:relative;
    background:var(--cream);
    color:var(--ink);
    border-radius:4px;
    padding:14px 14px 12px;
    min-height:150px;
    display:flex; flex-direction:column;
    overflow:hidden;
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:5px;
    background:repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,0.12) 6px 7px);
    opacity:0.6;
  }
  .card.secured{
    background:linear-gradient(155deg, var(--cream) 60%, #E8F2EA 100%);
    border-color:var(--green);
    box-shadow:0 8px 20px rgba(47,111,79,0.35);
  }
  .card.secured::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 40%, rgba(228,197,116,0.5) 50%, transparent 60%);
    animation:shine 1.1s ease;
    pointer-events:none;
  }
  @keyframes shine{
    from{ transform:translateX(-60%); opacity:1; }
    to{ transform:translateX(60%); opacity:0; }
  }
  .card.exhausted{
    border-color:var(--rust);
  }
  .slot-num{
    position:absolute; right:8px; top:2px;
    font-family:'Oswald', sans-serif;
    font-size:52px; font-weight:700;
    color:rgba(27,36,48,0.06);
    line-height:1;
    user-select:none;
  }
  .tier-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .tier-label.opt2, .tier-label.opt3{ color:var(--rust); }
  .player-name{
    font-family:'Oswald', sans-serif;
    font-size:19px;
    font-weight:600;
    line-height:1.15;
    margin:2px 0 1px;
    max-width:85%;
  }
  .player-team{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .player-fvm{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--green);
    font-weight:600;
    margin-bottom:10px;
  }
  .card.secured .player-fvm{ color:var(--green); }
  .package-players{
    display:flex; flex-direction:column; gap:3px;
    margin:4px 0 8px;
    padding:8px 9px;
    background:rgba(27,36,48,0.04);
    border-radius:4px;
    border:1px dashed rgba(27,36,48,0.15);
  }
  .package-player{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px;
    color:var(--ink);
  }
  .package-fvm{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .actions{
    margin-top:auto;
    display:flex; gap:8px;
  }
  .btn{
    flex:1;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:8px 6px;
    border-radius:3px;
    border:none;
    cursor:pointer;
    transition:filter 0.15s ease, transform 0.1s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-got{
    background:var(--green);
    color:#fff;
  }
  .btn-got:hover{ filter:brightness(1.1); }
  .btn-lost{
    background:transparent;
    color:var(--rust);
    border:1px solid var(--rust);
  }
  .btn-lost:hover{ background:rgba(178,58,46,0.08); }
  .secured-banner{
    display:flex; align-items:center; gap:8px;
    background:var(--green);
    color:#fff;
    font-family:'Oswald', sans-serif;
    font-size:13px;
    letter-spacing:0.03em;
    padding:8px 10px;
    border-radius:3px;
    margin-top:auto;
  }
  .secured-banner button{
    margin-left:auto;
    background:none; border:none; color:rgba(255,255,255,0.8);
    font-size:11px; cursor:pointer; text-decoration:underline;
    font-family:'IBM Plex Sans', sans-serif;
    padding:0;
  }
  .manual-wrap{
    margin-top:auto;
    display:flex; gap:6px;
  }
  .manual-wrap input{
    flex:1;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    padding:8px;
    border-radius:3px;
    border:1px solid var(--rust);
    background:#fff;
    color:var(--ink);
  }
  .manual-wrap button{
    background:var(--rust);
    color:#fff;
    border:none;
    border-radius:3px;
    padding:0 12px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .exhausted-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--rust);
    margin-bottom:6px;
  }
  .chain-toggle{
    background:none;
    border:none;
    border-top:1px dashed rgba(27,36,48,0.15);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    padding:8px 0 0;
    margin-top:10px;
    cursor:pointer;
    text-align:left;
  }
  .chain-toggle:hover{ color:var(--ink); }
  .chain-list{
    margin-top:8px;
    display:flex; flex-direction:column; gap:3px;
  }
  .chain-row{
    display:flex; align-items:center; gap:8px;
    font-size:11.5px;
    padding:5px 7px;
    border-radius:3px;
    background:rgba(27,36,48,0.035);
    color:var(--ink-soft);
  }
  .chain-row.past{
    text-decoration:line-through;
    opacity:0.55;
  }
  .chain-row.current{
    background:rgba(47,111,79,0.12);
    color:var(--ink);
    font-weight:600;
    border:1px solid rgba(47,111,79,0.3);
  }
  .chain-tier{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    min-width:52px;
    flex-shrink:0;
    color:var(--gold);
  }
  .chain-row.current .chain-tier{ color:var(--green); }
  .chain-name{
    flex:1;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .chain-team{
    font-size:10.5px;
    color:var(--ink-soft);
    font-weight:400;
  }
  .chain-fvm{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    font-weight:600;
    color:var(--green);
    flex-shrink:0;
  }
  footer{
    max-width:920px; margin:30px auto 0; padding:0 20px;
    font-size:11.5px; color:rgba(243,238,226,0.45);
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
  }
  .reset-all{
    background:none; border:1px solid rgba(201,162,75,0.4);
    color:var(--gold);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    margin-top:10px;
  }
  .save-status{
    display:inline-block;
    font-size:11px;
    color:var(--green-bright);
    margin-top:8px;
  }
  .save-status.unavailable{
    color:var(--rust);
  }
  @media (prefers-reduced-motion: reduce){
    .card.secured::after{ animation:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="pitch-banner">
    <div class="pitch-stripes"></div>
    <div class="pitch-halfline"></div>
    <div class="pitch-center-circle"></div>
    <span class="pitch-ball">⚽</span>
  </div>
  <div class="title-row">
    <h1>⚽ Fanta <span>Agricoltura</span> 2027</h1>
    <div class="subtitle">DRAFT TRACKER</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label">
      <span id="progressText">0 / 25 figurine prese</span>
      <span id="progressPct">0%</span>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<main id="main"></main>

<footer>
  Tocca "Preso" quando il giocatore è tuo. Tocca "Sfumato" se te lo portano via: l'alternativa successiva prende subito il suo posto.
  <br>
  <span id="saveStatus" class="save-status">💾 Salvataggio automatico attivo — riapri l'app e ritrovi tutto</span>
  <br>
  <button class="reset-all" onclick="resetAll()">Azzera tutto l'album</button>
</footer>

<script>
window.addEventListener('error', function(e){
  try{
    const main = document.getElementById('main');
    if(main){
      main.innerHTML = '<div style="color:#ffb4b4;padding:20px;font-family:monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;">'
        + '⚠️ Errore JavaScript — mostra questo screenshot a Claude:<br><br>'
        + 'Messaggio: ' + (e.message || 'sconosciuto')
        + '<br>Riga: ' + (e.lineno || '?') + ', colonna: ' + (e.colno || '?')
        + '</div>';
    }
  }catch(_){}
});
</script>
