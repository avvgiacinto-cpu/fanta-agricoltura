    return base;
  }catch(e){
    storageAvailable = false;
    return defaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    storageAvailable = false;
  }
}

let state = loadState();

function updateSaveStatus(){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  if(storageAvailable){
    el.textContent = "💾 Salvataggio automatico attivo — riapri l'app e ritrovi tutto";
    el.classList.remove('unavailable');
  } else {
    el.textContent = "⚠️ Salvataggio non disponibile in questa finestra (es. anteprima o navigazione privata) — i dati si perdono alla chiusura";
    el.classList.add('unavailable');
  }
}

let activeTab = 'P';
let expanded = new Set(); // keys "role-idx" currently showing full alt list

function toggleExpand(role, idx){
  const key = role+'-'+idx;
  if(expanded.has(key)) expanded.delete(key);
  else expanded.add(key);
  render();
}

const MAX_ALTS = 5;
const MANUAL_STAGE = MAX_ALTS + 1; // 6

function currentOption(role, idx){
  const entry = DATA[role][idx];
  const s = state[role][idx];
  if(s.stage === 0) return entry.primary;
  if(s.stage >= 1 && s.stage <= MAX_ALTS) return entry.alts[s.stage - 1];
  return null; // manual
}

function isPackageEntry(entry){
  return entry && entry.type === 'package';
}

function roleTotalSlots(role){
  return DATA[role].reduce((sum, entry)=> sum + (entry.size || 1), 0);
}

function roleGotSlots(role){
  return DATA[role].reduce((sum, entry, idx)=>{
    const s = state[role][idx];
    return sum + (s.secured ? (entry.size || 1) : 0);
  }, 0);
}

function tierLabel(stage){
  if(stage===0) return "Obiettivo primario";
  if(stage>=1 && stage<=MAX_ALTS) return "Alternativa " + stage;
  return "Sostituto";
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  Object.keys(ROLES).forEach(r=>{
    const total = roleTotalSlots(r);
    const got = roleGotSlots(r);
    const btn = document.createElement('div');
    btn.className = 'tab' + (activeTab===r ? ' active' : '');
    btn.innerHTML = `${ROLES[r]} <span class="count">${got}/${total}</span>`;
    btn.onclick = ()=>{ activeTab = r; render(); };
    tabsEl.appendChild(btn);
  });
  // Rosa tab
  let totalGot=0, totalSlots=0;
  Object.keys(DATA).forEach(r=>{ totalSlots += roleTotalSlots(r); totalGot += roleGotSlots(r); });
  const rosaBtn = document.createElement('div');
  rosaBtn.className = 'tab rosa-tab' + (activeTab==='ROSA' ? ' active' : '');
  rosaBtn.innerHTML = `★ La mia Rosa <span class="count">${totalGot}/${totalSlots}</span>`;
  rosaBtn.onclick = ()=>{ activeTab = 'ROSA'; render(); };
  tabsEl.appendChild(rosaBtn);
}

function renderProgress(){
  let total=0, got=0;
  Object.keys(DATA).forEach(r=>{
    total += roleTotalSlots(r);
    got += roleGotSlots(r);
  });
  const pct = Math.round((got/total)*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressText').textContent = `${got} / ${total} figurine prese`;
  document.getElementById('progressPct').textContent = pct+'%';
}

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '';

  const heading = document.createElement('div');
  heading.className = 'role-heading';
  heading.textContent = ROLES[activeTab];
  main.appendChild(heading);

  const grid = document.createElement('div');
  grid.className = 'grid';

  DATA[activeTab].forEach((entry, idx)=>{
    const s = state[activeTab][idx];
    const key = activeTab+'-'+idx;
    const isExpanded = expanded.has(key);
    const pkg = isPackageEntry(entry);
    const card = document.createElement('div');
    card.className = 'card' + (s.secured ? ' secured' : '') + (s.stage===MANUAL_STAGE && !s.secured ? ' exhausted' : '') + (pkg ? ' package-card' : '');

    const slotNum = document.createElement('div');
    slotNum.className = 'slot-num';
    slotNum.textContent = String(idx+1).padStart(2,'0');
    card.appendChild(slotNum);

    function packageBlock(opt){
      const total = opt.players.reduce((s,p)=>s+(p[2]||0),0);
      return `
        <div class="player-name">${opt.team}</div>
        <div class="player-team">Pacchetto completo — 3 portieri</div>
        <div class="package-players">
          ${opt.players.map(p=>`<div class="package-player"><span>${p[0]}</span><span class="package-fvm">${p[2]}</span></div>`).join('')}
        </div>
        <div class="player-fvm">Totale FVM ${total}</div>
      `;
    }

    if(s.secured){
      const opt = s.stage===MANUAL_STAGE ? (pkg ? {team:s.manualName||'Sostituto', players:[]} : [s.manualName || 'Sostituto', '', '']) : currentOption(activeTab, idx);
      const body = pkg ? packageBlock(opt) : `
        <div class="player-name">${opt[0]}</div>
        <div class="player-team">${opt[1]||''}</div>
        ${opt[2] ? `<div class="player-fvm">FVM ${opt[2]}</div>` : '<div class="player-fvm">&nbsp;</div>'}
      `;
      card.innerHTML += `
        <div class="tier-label">${tierLabel(s.stage)} — assicurato</div>
        ${body}
        <div class="secured-banner">✓ Preso
          <button onclick="undoSecure('${activeTab}',${idx})">annulla</button>
        </div>
      `;
    } else if(s.stage < MANUAL_STAGE){
      const opt = currentOption(activeTab, idx);
      const body = pkg ? packageBlock(opt) : `
        <div class="player-name">${opt[0]}</div>
        <div class="player-team">${opt[1]}</div>
        <div class="player-fvm">FVM ${opt[2]}</div>
      `;
      card.innerHTML += `
        <div class="tier-label ${s.stage>0?'opt2':''}">${tierLabel(s.stage)}</div>
        ${body}
        <div class="actions">
          <button class="btn btn-got" onclick="secure('${activeTab}',${idx})">✓ Preso</button>
          <button class="btn btn-lost" onclick="advance('${activeTab}',${idx})">✕ Sfumato</button>
        </div>
      `;
    } else {
      card.innerHTML += `
        <div class="exhausted-note">Anche le alternative sono sfumate</div>
        <div class="player-name" style="font-size:15px; opacity:0.6;">Scrivi il sostituto</div>
        <div class="manual-wrap">
          <input type="text" placeholder="${pkg ? 'Nome squadra' : 'Nome giocatore'}" id="manual-${activeTab}-${idx}" />
          <button onclick="confirmManual('${activeTab}',${idx})">OK</button>
        </div>
      `;
    }

    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'chain-toggle';
    toggleBtn.textContent = isExpanded ? '▲ Nascondi la catena' : '▾ Vedi tutte le sostituzioni';
    toggleBtn.onclick = ()=> toggleExpand(activeTab, idx);
    card.appendChild(toggleBtn);

    if(isExpanded){
      const chain = document.createElement('div');
      chain.className = 'chain-list';
      const allOptions = [entry.primary, ...entry.alts];
      chain.innerHTML = allOptions.map((opt, i)=>{
        const isCurrent = (s.stage === i);
        const isPast = (i < s.stage);
        if(pkg){
          const total = opt.players.reduce((s,p)=>s+(p[2]||0),0);
          const names = opt.players.map(p=>p[0]).join(', ');
          return `<div class="chain-row ${isCurrent?'current':''} ${isPast?'past':''}">
            <span class="chain-tier">${i===0?'Primario':'Alt.'+i}</span>
            <span class="chain-name">${opt.team} <span class="chain-team">(${names})</span></span>
            <span class="chain-fvm">${total}</span>
          </div>`;
        }
        return `<div class="chain-row ${isCurrent?'current':''} ${isPast?'past':''}">
          <span class="chain-tier">${i===0?'Primario':'Alt.'+i}</span>
          <span class="chain-name">${opt[0]} <span class="chain-team">(${opt[1]})</span></span>
          <span class="chain-fvm">${opt[2]}</span>
        </div>`;
      }).join('');
      card.appendChild(chain);
    }

    grid.appendChild(card);
  });

  main.appendChild(grid);
}

function getSecuredPlayers(){
  // returns array of {role, opt:[name,team,fvm], secuedAt: idx}
  const list = [];
  Object.keys(DATA).forEach(r=>{
    DATA[r].forEach((entry, idx)=>{
      const s = state[r][idx];
      if(!s.secured) return;
      const pkg = isPackageEntry(entry);
      if(pkg){
        if(s.stage===MANUAL_STAGE){
          list.push({ role:r, slot:idx, name:s.manualName || 'Sostituto', team:'', fvm:null });
        } else {
          const opt = currentOption(r, idx);
          opt.players.forEach(p=>{
            list.push({ role:r, slot:idx, name:p[0], team:p[1], fvm:p[2] });
          });
        }
      } else {
        const opt = s.stage===MANUAL_STAGE ? [s.manualName || 'Sostituto', '', null] : currentOption(r, idx);
        list.push({ role:r, slot:idx, name:opt[0], team:opt[1], fvm:opt[2] });
      }
    });
  });
  return list;
}

function renderRosa(){
  const main = document.getElementById('main');
  main.innerHTML = '';

  const heading = document.createElement('div');
  heading.className = 'role-heading';
  heading.textContent = 'La mia Rosa';
  main.appendChild(heading);

  const players = getSecuredPlayers();
  const totalFvm = players.reduce((sum,p)=> sum + (p.fvm || 0), 0);

  const summary = document.createElement('div');
  summary.className = 'rosa-summary';
  summary.innerHTML = `
    <div class="rosa-summary-row">
      <div class="rosa-stat">
        <div class="rosa-stat-label">Giocatori presi</div>
        <div class="rosa-stat-value">${players.length}<span class="rosa-stat-sub">/25</span></div>
      </div>
      <div class="rosa-stat">
        <div class="rosa-stat-label">Valore totale listone</div>
        <div class="rosa-stat-value gold">${totalFvm}<span class="rosa-stat-sub">FVM</span></div>
      </div>
    </div>
  `;
  main.appendChild(summary);

  if(players.length === 0){
    const empty = document.createElement('div');
    empty.className = 'rosa-empty';
    empty.textContent = 'Non hai ancora assicurato nessun giocatore. Torna alle schede per ruolo e tocca "✓ Preso" man mano che chiudi le chiamate.';
    main.appendChild(empty);
    return;
  }

  Object.keys(ROLES).forEach(r=>{
    const rolePlayers = players.filter(p=>p.role===r).sort((a,b)=>a.slot-b.slot);
    if(rolePlayers.length===0) return;
    const roleSum = rolePlayers.reduce((s,p)=>s+(p.fvm||0),0);

    const block = document.createElement('div');
    block.className = 'rosa-role-block';
    block.innerHTML = `<div class="rosa-role-header">
        <span>${ROLES[r]}</span>
        <span class="rosa-role-count">${rolePlayers.length} · ${roleSum} FVM</span>
      </div>`;

    const list = document.createElement('div');
    list.className = 'rosa-list';
    list.innerHTML = rolePlayers.map(p=>`
      <div class="rosa-row">
        <span class="rosa-row-name">${p.name}</span>
        <span class="rosa-row-team">${p.team||''}</span>
        <span class="rosa-row-fvm">${p.fvm!=null ? p.fvm : '—'}</span>
      </div>
    `).join('');

    block.appendChild(list);
    main.appendChild(block);
  });
}

function render(){
  renderTabs();
  renderProgress();
  updateSaveStatus();
  if(activeTab === 'ROSA') renderRosa();
  else renderMain();
}

function secure(role, idx){
  state[role][idx].secured = true;
  saveState();
  render();
}

function advance(role, idx){
  state[role][idx].stage = Math.min(state[role][idx].stage + 1, MANUAL_STAGE);
  saveState();
  render();
}

function confirmManual(role, idx){
  const input = document.getElementById(`manual-${role}-${idx}`);
  const val = input.value.trim();
  if(!val) return;
  state[role][idx].manualName = val;
  state[role][idx].secured = true;
  saveState();
  render();
}

function undoSecure(role, idx){
  state[role][idx].secured = false;
  saveState();
  render();
}

function resetAll(){
  if(!confirm("Azzerare tutto l'album e ricominciare da capo?")) return;
  state = defaultState();
  saveState();
  render();
}

render();
</script>
</body>
</html>
